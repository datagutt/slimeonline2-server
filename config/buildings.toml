# Slime Online 2 - Building Spots Configuration
#
# Building spots are locations in rooms where players can place buildable items.
# Items like the Weak Cannon Kit (26) can be placed on these spots.
#
# Format:
#   [room.<room_id>]
#   spots = [{ id = <spot_id> }, ...]
#
# Building objects:
#   [objects.<item_id>]
#   name = "Object Name"
#   duration_hours = 24  # How long until the building expires

# =============================================================================
# Building Objects - Items that can be placed on building spots
# =============================================================================

[objects]

[objects.26]
name = "Weak Cannon"
duration_hours = 24

